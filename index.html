<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>シークレット通信網 - Secret Network</title>
  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <!-- PeerJS CDN (音声・ビデオ通話用) -->
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ヘッダーナビ */
    .app-header {
      background: #1e293b;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
    }

    .tab-btn {
      background: #334155;
      color: #cbd5e1;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.15s;
    }
    .tab-btn.active {
      background: #0284c7;
      color: #fff;
    }

    .user-badge {
      font-size: 12px;
      color: #38bdf8;
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #334155;
    }

    /* メインビュー */
    .view-container {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .view-container.active {
      display: flex;
    }

    /* --- チャットビュー --- */
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-msg {
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 12px;
      max-width: 75%;
      word-break: break-all;
      border: 1px solid #334155;
    }
    .chat-msg.mine {
      background: #0284c7;
      align-self: flex-end;
      border-color: #0369a1;
    }
    .msg-name {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .chat-msg.mine .msg-name { color: #e0f2fe; text-align: right; }

    .chat-img {
      max-width: 100%;
      max-height: 250px;
      border-radius: 8px;
      margin-top: 6px;
      cursor: pointer;
    }

    .chat-input-area {
      padding: 14px;
      background: #1e293b;
      display: flex;
      gap: 10px;
      border-top: 1px solid #334155;
    }

    .chat-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 10px 14px;
      border-radius: 8px;
      outline: none;
      font-size: 14px;
    }

    .btn-action {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 0 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-action:hover { background: #0369a1; }

    .btn-img {
      background: #475569;
      color: #fff;
      border: none;
      padding: 0 14px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    /* --- 通話ビュー --- */
    .call-view {
      padding: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      height: 100%;
    }

    .call-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .video-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      max-width: 600px;
      margin-bottom: 16px;
    }

    .video-box {
      background: #0f172a;
      border: 2px solid #334155;
      border-radius: 12px;
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .video-box video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-label {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0,0,0,0.6);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
    }

    .id-input {
      width: 100%;
      background: #0f172a;
      border: 1px solid #475569;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header class="app-header">
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchView('chat')">💬 チャンネル</button>
      <button class="tab-btn" onclick="switchView('call')">📞 音声・ビデオ通話</button>
    </div>
    <div class="user-badge" id="myUserBadge">接続中...</div>
  </header>

  <!-- ================= 1. チャットビュー ================= -->
  <div id="viewChat" class="view-container active">
    <div class="chat-messages" id="chatMessagesContainer"></div>
    <div class="chat-input-area">
      <input type="file" id="imageFileInput" accept="image/*" style="display: none;" onchange="sendImageFile(this)">
      <button class="btn-img" onclick="document.getElementById('imageFileInput').click()">📷</button>
      <input type="text" id="chatInputText" class="chat-input" placeholder="メッセージを入力..." onkeydown="if(event.key==='Enter') sendChatMessage()">
      <button class="btn-action" onclick="sendChatMessage()">送信</button>
    </div>
  </div>

  <!-- ================= 2. 通話ビュー ================= -->
  <div id="viewCall" class="view-container">
    <div class="call-view">
      <div class="video-grid">
        <div class="video-box">
          <video id="localVideo" autoplay muted playsinline></video>
          <div class="video-label">自分</div>
        </div>
        <div class="video-box">
          <video id="remoteVideo" autoplay playsinline></video>
          <div class="video-label">相手</div>
        </div>
      </div>

      <div class="call-card">
        <h3 style="margin-bottom: 8px; font-size: 16px;">通話接続パネル</h3>
        <p style="font-size: 12px; color: #94a3b8; margin-bottom: 14px;">相手のIDを入力して呼び出します</p>
        <input type="text" id="targetPeerIdInput" class="id-input" placeholder="相手のIDを入力">
        <div style="display: flex; gap: 10px;">
          <button class="btn-action" style="flex:1; background: #10b981; padding: 12px;" onclick="startCall(false)">📞 音声通話</button>
          <button class="btn-action" style="flex:1; background: #0284c7; padding: 12px;" onclick="startCall(true)">📹 ビデオ通話</button>
          <button class="btn-action" style="background: #ef4444; padding: 12px;" onclick="hangUpCall()">切断</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // --- Firebase 設定 (道下タイピングのDBを共有利用) ---
    const firebaseConfig = {
      databaseURL: "https://michishita-typing-94d91-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let myName = "エージェント_" + Math.floor(Math.random() * 900 + 100);
    document.getElementById('myUserBadge').innerText = `ID: ${myName}`;

    // --- タブ切り替え ---
    function switchView(viewName) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));

      if (viewName === 'chat') {
        document.querySelector('.nav-tabs button:nth-child(1)').classList.add('active');
        document.getElementById('viewChat').classList.add('active');
      } else if (viewName === 'call') {
        document.querySelector('.nav-tabs button:nth-child(2)').classList.add('active');
        document.getElementById('viewCall').classList.add('active');
      }
    }

    // --- リアルタイムテキスト ＆ 画像チャット ---
    function initChatSync() {
      const container = document.getElementById('chatMessagesContainer');
      db.ref('secret_chat_room').limitToLast(50).on('value', (snapshot) => {
        container.innerHTML = '';
        const data = snapshot.val() || {};
        Object.values(data).forEach(msg => {
          const div = document.createElement('div');
          const isMine = msg.name === myName;
          div.className = `chat-msg ${isMine ? 'mine' : ''}`;
          
          let contentHtml = `<div class="msg-name">${msg.name} (${msg.time})</div>`;
          if (msg.type === 'image') {
            contentHtml += `<img src="${msg.data}" class="chat-img" onclick="window.open('${msg.data}')">`;
          } else {
            contentHtml += `<div>${escapeHtml(msg.text)}</div>`;
          }
          div.innerHTML = contentHtml;
          container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
      });
    }

    function sendChatMessage() {
      const input = document.getElementById('chatInputText');
      const text = input.value.trim();
      if (!text) return;

      db.ref('secret_chat_room').push({
        name: myName,
        text: text,
        type: 'text',
        time: new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'})
      });
      input.value = '';
    }

    // 写真をBase64に圧縮して送信
    function sendImageFile(inputElement) {
      const file = inputElement.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 500;
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }
          canvas.width = width;
          canvas.height = height;
          const canvasCtx = canvas.getContext('2d');
          canvasCtx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

          db.ref('secret_chat_room').push({
            name: myName,
            data: dataUrl,
            type: 'image',
            time: new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'})
          });
        }
        img.src = e.target.result;
      }
      reader.readAsDataURL(file);
      inputElement.value = '';
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // --- PeerJS による音声・ビデオ通話機能 ---
    let peer = null;
    let localStream = null;
    let currentCall = null;

    function initPeerJS() {
      // 自分の名前をPeerIDとして利用
      peer = new Peer(myName);

      peer.on('open', (id) => {
        console.log('Peer ID取得:', id);
        // チャット内等で相手にIDを伝えられるよう自分のIDを表示
        document.getElementById('myUserBadge').innerText = `ID: ${myName} (通話待受中)`;
      });

      // 着信時の処理
      peer.on('call', async (call) => {
        if (confirm(`${call.peer} から着信がありました。応答しますか？`)) {
          try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
            
            call.answer(localStream);
            currentCall = call;

            call.on('stream', (remoteStream) => {
              document.getElementById('remoteVideo').srcObject = remoteStream;
            });
          } catch (err) {
            alert('カメラまたはマイクの取得に失敗しました。');
          }
        } else {
          call.close();
        }
      });
    }

    async function startCall(withVideo) {
      const targetId = document.getElementById('targetPeerIdInput').value.trim();
      if (!targetId) {
        alert('相手のIDを入力してください！');
        return;
      }

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: withVideo, audio: true });
        document.getElementById('localVideo').srcObject = localStream;

        const call = peer.call(targetId, localStream);
        currentCall = call;

        call.on('stream', (remoteStream) => {
          document.getElementById('remoteVideo').srcObject = remoteStream;
        });

        call.on('close', () => {
          hangUpCall();
        });
        alert('呼び出し中...');
      } catch (err) {
        alert('マイク・カメラのアクセスが拒否されたか、利用できません。');
      }
    }

    function hangUpCall() {
      if (currentCall) {
        currentCall.close();
        currentCall = null;
      }
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      document.getElementById('localVideo').srcObject = null;
      document.getElementById('remoteVideo').srcObject = null;
      alert('通話を終了しました。');
    }

    // --- 初期化 ---
    window.onload = function() {
      initChatSync();
      initPeerJS();
    };
  </script>
</body>
</html>
