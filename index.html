<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>シークレット通信網 - 道下特設ポータル</title>
  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background: linear-gradient(180deg, #7dd3fc 0%, #bae6fd 40%, #86efac 75%, #4ade80 100%);
      background-attachment: fixed;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    /* アプリ全体コンテナ（比率切り替え対応） */
    .app-container {
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 22px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transition: all 0.3s ease;
    }

    /* スマホモード (9:16風) */
    .app-container.mode-mobile {
      max-width: 420px;
      height: 92vh;
      max-height: 820px;
    }

    /* PCモード (16:9風) */
    .app-container.mode-pc {
      max-width: 860px;
      height: 88vh;
      max-height: 650px;
    }

    /* --- モーダル共通 --- */
    .custom-modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      border: 2px solid #e0f2fe;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 900;
      color: #0284c7;
      margin-bottom: 6px;
    }
    .modal-desc {
      font-size: 12.5px;
      color: #64748b;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .modal-input {
      width: 100%;
      height: 46px;
      border: 2px solid #bae6fd;
      border-radius: 23px;
      padding: 0 16px;
      font-size: 15px;
      font-weight: 800;
      color: #0284c7;
      text-align: center;
      outline: none;
      background: #f8fafc;
      margin-bottom: 14px;
    }
    .modal-input:focus {
      border-color: #0284c7;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
    }

    /* ヘッダー */
    .app-header {
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(226, 232, 240, 0.8);
      flex-shrink: 0;
    }
    .logo-area {
      font-weight: 900;
      font-size: 14px;
      color: #0284c7;
    }
    .header-actions {
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .header-btn {
      background: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      color: #334155;
      font-size: 10.5px;
      font-weight: 800;
      padding: 5px 8px;
      border-radius: 12px;
      cursor: pointer;
    }
    .header-btn:hover { background: #e2e8f0; }

    /* タブバー */
    .tab-bar {
      display: flex;
      background: #f1f5f9;
      padding: 6px;
      gap: 4px;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .tab-item {
      flex: 1;
      text-align: center;
      padding: 9px 0;
      font-size: 12px;
      font-weight: 800;
      color: #64748b;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.15s;
    }
    .tab-item.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
    }

    /* ビュー切り替えコンテナ */
    .view-content {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
      background: #f8fafc;
      min-height: 0;
    }
    .view-content.active {
      display: flex;
    }

    /* --- チャット・DM共通スクロール領域 --- */
    .messages-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }
    .chat-bubble {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      padding: 10px 14px;
      border-radius: 16px;
      max-width: 80%;
      word-break: break-all;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      position: relative;
    }
    .chat-bubble.mine {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      align-self: flex-end;
      border-color: #0284c7;
    }
    .bubble-name {
      font-size: 10.5px;
      color: #64748b;
      margin-bottom: 3px;
      font-weight: 800;
    }
    .chat-bubble.mine .bubble-name { color: #bae6fd; text-align: right; }
    
    .chat-img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 10px;
      margin-top: 6px;
      cursor: pointer;
    }

    /* メッセージ取り消しボタン */
    .btn-delete-msg {
      background: none;
      border: none;
      color: #cbd5e1;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 4px;
      display: block;
      text-align: right;
    }
    .chat-bubble.mine .btn-delete-msg { color: #e0f2fe; }
    .btn-delete-msg:hover { text-decoration: underline; }

    /* 入力エリア */
    .input-box-area {
      padding: 12px 16px;
      background: #ffffff;
      display: flex;
      gap: 8px;
      border-top: 1.5px solid #e2e8f0;
      flex-shrink: 0;
    }
    .text-input {
      flex: 1;
      height: 42px;
      border: 2px solid #bae6fd;
      border-radius: 21px;
      padding: 0 16px;
      outline: none;
      font-size: 14px;
      font-weight: 700;
      background: #f8fafc;
      color: #1e293b;
    }
    .text-input:focus { border-color: #0284c7; background: #ffffff; }

    .btn-clean {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      padding: 0 18px;
      height: 42px;
      border-radius: 21px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      white-space: nowrap;
    }
    .btn-icon {
      background: #e0f2fe;
      color: #0284c7;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* --- DMユーザーリスト画面 --- */
    .dm-layout {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    .user-list-pane {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      min-height: 0;
    }
    .user-item {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      padding: 14px 18px;
      border-radius: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: transform 0.1s;
      position: relative;
    }
    .user-item:hover { transform: translateY(-2px); border-color: #0284c7; }

    /* 未読バッジ（赤点！） */
    .unread-badge {
      background: #ef4444;
      color: #ffffff;
      font-size: 10.5px;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4);
    }

    /* --- スタイリッシュなステータスランプ (Discord風) --- */
    .status-indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .status-indicator.online {
      background-color: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }
    .status-indicator.offline {
      background-color: #94a3b8;
    }

    /* --- 通話ビュー --- */
    .call-pane {
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 100%;
      overflow-y: auto;
    }
    .video-grid-box {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      max-width: 600px;
    }
    .video-card {
      background: #0f172a;
      border-radius: 14px;
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      border: 2px solid #cbd5e1;
    }
    .video-card video { width: 100%; height: 100%; object-fit: cover; }
    .video-tag {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body class="mode-mobile" id="bodyRoot">

  <!-- 名前の初期設定モーダル -->
  <div id="nameModal" class="custom-modal">
    <div class="modal-card">
      <div class="modal-title">🔐 道下登録</div>
      <div class="modal-desc">通信網で使用するあなたの名前（道下ネーム）を決めてください。</div>
      <input type="text" id="initialNameInput" class="modal-input" placeholder="例: 道下ファン" maxlength="10">
      <button class="btn-clean" style="width: 100%; height: 46px; border-radius: 23px;" onclick="saveInitialName()">通信網に参加する</button>
    </div>
  </div>

  <!-- 名前変更モーダル -->
  <div id="settingsModal" class="custom-modal" style="display: none;">
    <div class="modal-card">
      <div class="modal-title">⚙️ 道下設定</div>
      <div class="modal-desc">いつでも名前を変更できます。</div>
      <input type="text" id="changeNameInput" class="modal-input" maxlength="10">
      <div style="display: flex; gap: 8px;">
        <button class="btn-clean" style="flex:1; background: #64748b;" onclick="closeSettingsModal()">キャンセル</button>
        <button class="btn-clean" style="flex:1;" onclick="updateAgentName()">保存する</button>
      </div>
    </div>
  </div>

  <div class="app-container mode-mobile" id="appContainer">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="logo-area" id="headerUserTag">道下: 読み込み中...</div>
      <div class="header-actions">
        <button class="header-btn" id="soundToggleBtn" onclick="toggleSound()">🔇 ミュート</button>
        <button class="header-btn" onclick="requestNotificationPermission()">🔔 通知</button>
        <button class="header-btn" onclick="openSettingsModal()">⚙️ 設定</button>
        <button class="header-btn" id="ratioToggleBtn" onclick="toggleScreenMode()">💻 PC</button>
      </div>
    </header>

    <!-- タブバー -->
    <div class="tab-bar">
      <div class="tab-item active" onclick="switchTab('channel')">💬 全体チャンネル</div>
      <div class="tab-item" onclick="switchTab('dm')">✉️ 個人チャット</div>
      <div class="tab-item" onclick="switchTab('call')">📞 通話</div>
    </div>

    <!-- ================= 1. 全体チャンネル ================= -->
    <div id="viewChannel" class="view-content active">
      <div class="messages-area" id="channelMessages"></div>
      <div class="input-box-area">
        <input type="file" id="channelImgInput" accept="image/*" style="display: none;" onchange="sendImage(this, 'channel')">
        <button class="btn-icon" onclick="playTapSound(); document.getElementById('channelImgInput').click()">📷</button>
        <input type="text" id="channelInput" class="text-input" placeholder="メッセージを入力..." onkeydown="if(event.key==='Enter') sendChannelMsg()">
        <button class="btn-clean" onclick="sendChannelMsg()">送信</button>
      </div>
    </div>

    <!-- ================= 2. 個人チャット (DM) ================= -->
    <div id="viewDm" class="view-content">
      <div class="dm-layout" id="dmUserListLayout">
        <div style="padding: 12px 16px 6px; font-weight: 900; font-size: 13px; color: #64748b; flex-shrink: 0;">道下ファン一覧</div>
        <div class="user-list-pane" id="onlineUserListContainer"></div>
      </div>
      <div class="dm-layout" id="dmChatRoomLayout" style="display: none;">
        <div style="background: #ffffff; padding: 8px 16px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
          <button class="btn-clean" style="height: 30px; padding: 0 10px; font-size: 11.5px; background: #64748b;" onclick="playTapSound(); backToUserList()">← 戻る</button>
          <div id="activeDmTitle" style="font-weight: 900; font-size: 13.5px; color: #0284c7;"></div>
          <div style="width: 45px;"></div>
        </div>
        <div class="messages-area" id="dmMessagesContainer"></div>
        <div class="input-box-area">
          <input type="file" id="dmImgInput" accept="image/*" style="display: none;" onchange="sendImage(this, 'dm')">
          <button class="btn-icon" onclick="playTapSound(); document.getElementById('dmImgInput').click()">📷</button>
          <input type="text" id="dmInput" class="text-input" placeholder="DMを入力..." onkeydown="if(event.key==='Enter') sendDmMsg()">
          <button class="btn-clean" onclick="sendDmMsg()">送信</button>
        </div>
      </div>
    </div>

    <!-- ================= 3. 通話タブ ================= -->
    <div id="viewCall" class="view-content">
      <div class="call-pane">
        <div class="video-grid-box">
          <div class="video-card">
            <video id="localVideo" autoplay muted playsinline></video>
            <div class="video-tag">自分</div>
          </div>
          <div class="video-card">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="video-tag">相手</div>
          </div>
        </div>
        <div style="width: 100%; max-width: 600px; background: #ffffff; padding: 14px; border-radius: 14px; border: 1.5px solid #e2e8f0; text-align: center;">
          <div style="font-size: 12px; font-weight: 800; color: #64748b; margin-bottom: 6px;">相手の道下ネームを入力して呼び出し</div>
          <input type="text" id="targetIdInput" class="text-input" placeholder="相手の名前" style="text-align: center; margin-bottom: 8px;">
          <div style="display: flex; gap: 8px;">
            <button class="btn-clean" style="flex:1; background: #10b981;" onclick="playTapSound(); startCall(false)">音声</button>
            <button class="btn-clean" style="flex:1;" onclick="playTapSound(); startCall(true)">ビデオ</button>
            <button class="btn-clean" style="background: #ef4444;" onclick="playTapSound(); hangUp()">切断</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_NAME_KEY = 'SECRET_NETWORK_AGENT_NAME_V1';
    let myName = localStorage.getItem(STORAGE_NAME_KEY) || "";

    const firebaseConfig = {
      databaseURL: "https://michishita-typing-94d91-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let currentActiveDmUser = null;
    let isPcMode = false;
    let isSoundOn = localStorage.getItem('SECRET_NETWORK_SOUND') === 'ON';

    // --- サウンド（Web Audio API）関連 ---
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playBeep(freq, type = 'sine', duration = 0.08, vol = 0.1) {
      if (!isSoundOn) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function playTapSound() { playBeep(600, 'triangle', 0.04, 0.05); }
    function playSendSound() { playBeep(900, 'sine', 0.08, 0.1); }
    function playReceiveSound() {
      playBeep(800, 'sine', 0.08, 0.1);
      setTimeout(() => playBeep(1100, 'sine', 0.12, 0.12), 100);
    }

    function toggleSound() {
      isSoundOn = !isSoundOn;
      localStorage.setItem('SECRET_NETWORK_SOUND', isSoundOn ? 'ON' : 'OFF');
      const btn = document.getElementById('soundToggleBtn');
      btn.innerText = isSoundOn ? '🔊 音声ON' : '🔇 ミュート';
      if (isSoundOn) {
        playTapSound();
        requestNotificationPermission();
      }
    }

    // --- ブラウザ通知機能 ---
    function requestNotificationPermission() {
      if (!("Notification" in window)) {
        alert("このブラウザは通知に対応していません。");
        return;
      }
      Notification.requestPermission().then(permission => {
        if (permission === "granted") {
          alert("通知が許可されました！新着メッセージでお知らせします。");
        } else {
          alert("通知が拒否されました。ブラウザの設定から許可してください。");
        }
      });
    }

    function showBrowserNotification(title, bodyText) {
      if (Notification.permission === "granted" && document.hidden) {
        new Notification(title, {
          body: bodyText,
          icon: "https://cdn-icons-png.flaticon.com/512/3067/3067400.png"
        });
      }
    }

    window.onload = function() {
      const btn = document.getElementById('soundToggleBtn');
      btn.innerText = isSoundOn ? '🔊 音声ON' : '🔇 ミュート';

      if (myName) {
        document.getElementById('nameModal').style.display = 'none';
        initApp();
      }
    };

    function saveInitialName() {
      const input = document.getElementById('initialNameInput').value.trim();
      if (!input) {
        alert("名前を入力してください！");
        return;
      }
      playTapSound();
      myName = input.substring(0, 10);
      localStorage.setItem(STORAGE_NAME_KEY, myName);
      document.getElementById('nameModal').style.display = 'none';
      initApp();
    }

    function openSettingsModal() {
      playTapSound();
      document.getElementById('changeNameInput').value = myName;
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettingsModal() {
      playTapSound();
      document.getElementById('settingsModal').style.display = 'none';
    }

    function updateAgentName() {
      const newName = document.getElementById('changeNameInput').value.trim();
      if (!newName) {
        alert("名前を入力してください！");
        return;
      }
      myName = newName.substring(0, 10);
      localStorage.setItem(STORAGE_NAME_KEY, myName);
      closeSettingsModal();
      document.getElementById('headerUserTag').innerText = `道下: ${myName}`;
      registerUserPresence();
      if (peer) {
        peer.destroy();
        initPeerJS();
      }
      alert(`名前を「${myName}」に変更しました！`);
    }

    function toggleScreenMode() {
      playTapSound();
      isPcMode = !isPcMode;
      const container = document.getElementById('appContainer');
      const btn = document.getElementById('ratioToggleBtn');
      if (isPcMode) {
        container.classList.remove('mode-mobile');
        container.classList.add('mode-pc');
        btn.innerText = "📱 スマホ";
      } else {
        container.classList.remove('mode-pc');
        container.classList.add('mode-mobile');
        btn.innerText = "💻 PC";
      }
    }

    function initApp() {
      document.getElementById('headerUserTag').innerText = `道下: ${myName}`;
      registerUserPresence();
      initChannelSync();
      initUserListSync();
      initPeerJS();
    }

    function registerUserPresence() {
      const userRef = db.ref('secret_users/' + myName);
      userRef.set({
        name: myName,
        lastActive: firebase.database.ServerValue.TIMESTAMP
      });

      if (window.presenceInterval) clearInterval(window.presenceInterval);
      window.presenceInterval = setInterval(() => {
        userRef.update({ lastActive: firebase.database.ServerValue.TIMESTAMP });
      }, 10000);
    }

    function switchTab(tabName) {
      playTapSound();
      const tabs = ['channel', 'dm', 'call'];
      tabs.forEach((t, idx) => {
        document.querySelectorAll('.tab-item')[idx].classList.remove('active');
        document.getElementById('view' + t.charAt(0).toUpperCase() + t.slice(1)).classList.remove('active');
      });

      const activeIdx = tabs.indexOf(tabName);
      document.querySelectorAll('.tab-item')[activeIdx].classList.add('active');
      document.getElementById('view' + tabName.charAt(0).toUpperCase() + tabName.slice(1)).classList.add('active');
    }

    // --- 全体チャンネルチャット ---
    let lastChannelMsgCount = null;
    function initChannelSync() {
      const container = document.getElementById('channelMessages');
      db.ref('secret_channel').limitToLast(50).on('value', (snapshot) => {
        container.innerHTML = '';
        const data = snapshot.val() || {};
        const entries = Object.entries(data);

        if (lastChannelMsgCount !== null && entries.length > lastChannelMsgCount) {
          const latest = entries[entries.length - 1][1];
          if (latest.name !== myName) {
            playReceiveSound();
            showBrowserNotification(`[全体] ${latest.name}さん`, latest.type === 'image' ? '画像を送信しました' : latest.text);
          }
        }
        lastChannelMsgCount = entries.length;

        entries.forEach(([key, msg]) => {
          const div = document.createElement('div');
          const isMine = msg.name === myName;
          div.className = `chat-bubble ${isMine ? 'mine' : ''}`;
          
          let html = `<div class="bubble-name">${msg.name} (${msg.time})</div>`;
          if (msg.type === 'image') {
            html += `<img src="${msg.data}" class="chat-img" onclick="window.open('${msg.data}')">`;
          } else {
            html += `<div>${escapeHtml(msg.text)}</div>`;
          }
          if (isMine) {
            html += `<button class="btn-delete-msg" onclick="deleteChannelMsg('${key}')">🗑️ 取り消し</button>`;
          }
          div.innerHTML = html;
          container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
      });
    }

    function sendChannelMsg() {
      const input = document.getElementById('channelInput');
      const text = input.value.trim();
      if (!text) return;

      playSendSound();
      db.ref('secret_channel').push({
        name: myName,
        text: text,
        type: 'text',
        time: new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'})
      });
      input.value = '';
    }

    function deleteChannelMsg(msgKey) {
      if (confirm("このメッセージを取り消しますか？")) {
        playTapSound();
        db.ref('secret_channel/' + msgKey).remove();
      }
    }

    // --- 個人チャット (DM ＆ ステータスランプ) ---
    function initUserListSync() {
      const container = document.getElementById('onlineUserListContainer');
      
      db.ref('secret_users').on('value', (userSnap) => {
        const users = userSnap.val() || {};
        
        db.ref('secret_dms').on('value', (dmSnap) => {
          const allDms = dmSnap.val() || {};
          container.innerHTML = '';
          const now = Date.now();

          Object.values(users).forEach(u => {
            if (u.name === myName) return;

            const isOnline = u.lastActive && (now - u.lastActive < 25000);
            const statusClass = isOnline ? 'online' : 'offline';

            const roomId = getDmRoomId(myName, u.name);
            const roomMsgs = allDms[roomId] || {};
            const msgKeys = Object.keys(roomMsgs);
            
            let hasUnread = false;
            if (msgKeys.length > 0) {
              const lastMsg = roomMsgs[msgKeys[msgKeys.length - 1]];
              const lastReadTime = Number(localStorage.getItem('LAST_READ_' + roomId) || 0);
              if (lastMsg.name !== myName && lastMsg.rawTime > lastReadTime) {
                hasUnread = true;
              }
            }

            const div = document.createElement('div');
            div.className = 'user-item';
            div.innerHTML = `
              <div style="display: flex; align-items: center; gap: 10px;">
                <span class="status-indicator ${statusClass}"></span>
                <span>${u.name}</span>
                ${hasUnread ? '<span class="unread-badge">! 未読</span>' : ''}
              </div>
              <span style="font-size: 11px; color: #0284c7;">チャットを開く →</span>
            `;
            div.onclick = () => { playTapSound(); openDmChat(u.name); };
            container.appendChild(div);
          });
        });
      });
    }

    function getDmRoomId(userA, userB) {
      return [userA, userB].sort().join('_');
    }

    function openDmChat(targetName) {
      currentActiveDmUser = targetName;
      document.getElementById('activeDmTitle').innerText = `${targetName} とのDM`;
      document.getElementById('dmUserListLayout').style.display = 'none';
      document.getElementById('dmChatRoomLayout').style.display = 'flex';
      
      const roomId = getDmRoomId(myName, targetName);
      localStorage.setItem('LAST_READ_' + roomId, Date.now());

      initDmSync();
    }

    function backToUserList() {
      currentActiveDmUser = null;
      document.getElementById('dmChatRoomLayout').style.display = 'none';
      document.getElementById('dmUserListLayout').style.display = 'flex';
    }

    let lastDmMsgCount = {};
    function initDmSync() {
      if (!currentActiveDmUser) return;
      const roomId = getDmRoomId(myName, currentActiveDmUser);
      const container = document.getElementById('dmMessagesContainer');

      db.ref('secret_dms/' + roomId).limitToLast(50).on('value', (snapshot) => {
        container.innerHTML = '';
        const data = snapshot.val() || {};
        const entries = Object.entries(data);

        if (lastDmMsgCount[roomId] !== undefined && entries.length > lastDmMsgCount[roomId]) {
          const latest = entries[entries.length - 1][1];
          if (latest.name !== myName) {
            playReceiveSound();
            showBrowserNotification(`[DM] ${latest.name}さん`, latest.type === 'image' ? '画像を送信しました' : latest.text);
          }
        }
        lastDmMsgCount[roomId] = entries.length;

        entries.forEach(([key, msg]) => {
          const div = document.createElement('div');
          const isMine = msg.name === myName;
          div.className = `chat-bubble ${isMine ? 'mine' : ''}`;
          
          let html = `<div class="bubble-name">${msg.name} (${msg.time})</div>`;
          if (msg.type === 'image') {
            html += `<img src="${msg.data}" class="chat-img" onclick="window.open('${msg.data}')">`;
          } else {
            html += `<div>${escapeHtml(msg.text)}</div>`;
          }
          if (isMine) {
            html += `<button class="btn-delete-msg" onclick="deleteDmMsg('${roomId}', '${key}')">🗑️ 取り消し</button>`;
          }
          div.innerHTML = html;
          container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
      });
    }

    function sendDmMsg() {
      if (!currentActiveDmUser) return;
      const input = document.getElementById('dmInput');
      const text = input.value.trim();
      if (!text) return;

      playSendSound();
      const roomId = getDmRoomId(myName, currentActiveDmUser);
      const now = Date.now();
      db.ref('secret_dms/' + roomId).push({
        name: myName,
        text: text,
        type: 'text',
        rawTime: now,
        time: new Date(now).toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'})
      });
      localStorage.setItem('LAST_READ_' + roomId, now);
      input.value = '';
    }

    function deleteDmMsg(roomId, msgKey) {
      if (confirm("このメッセージを取り消しますか？")) {
        playTapSound();
        db.ref('secret_dms/' + roomId + '/' + msgKey).remove();
      }
    }

    // --- 写真送信機能 ---
    function sendImage(inputElement, mode) {
      const file = inputElement.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 450;
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

          playSendSound();
          const now = Date.now();
          const payload = {
            name: myName,
            data: dataUrl,
            type: 'image',
            rawTime: now,
            time: new Date(now).toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'})
          };

          if (mode === 'channel') {
            db.ref('secret_channel').push(payload);
          } else if (mode === 'dm' && currentActiveDmUser) {
            const roomId = getDmRoomId(myName, currentActiveDmUser);
            db.ref('secret_dms/' + roomId).push(payload);
            localStorage.setItem('LAST_READ_' + roomId, now);
          }
        }
        img.src = e.target.result;
      }
      reader.readAsDataURL(file);
      inputElement.value = '';
    }

    // --- PeerJS 通話機能 ---
    let peer = null;
    let localStream = null;
    let currentCall = null;

    function initPeerJS() {
      peer = new Peer(myName);
      peer.on('call', async (call) => {
        if (confirm(`${call.peer} から通話の着信です。応答しますか？`)) {
          try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
            call.answer(localStream);
            currentCall = call;
            call.on('stream', (stream) => {
              document.getElementById('remoteVideo').srcObject = stream;
            });
          } catch (e) {
            alert("通話応答エラー: " + e.message);
          }
        } else {
          call.close();
        }
      });
    }

    async function startCall(withVideo) {
      const targetId = document.getElementById('targetIdInput').value.trim();
      if (!targetId) {
        alert("相手の道下ネームを入力してください！");
        return;
      }
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: withVideo, audio: true });
        document.getElementById('localVideo').srcObject = localStream;

        const call = peer.call(targetId, localStream);
        currentCall = call;
        call.on('stream', (stream) => {
          document.getElementById('remoteVideo').srcObject = stream;
        });
        alert("呼び出し中...");
      } catch (e) {
        alert("マイク・カメラの取得に失敗しました: " + e.message);
      }
    }

    function hangUp() {
      if (currentCall) { currentCall.close(); currentCall = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      document.getElementById('localVideo').srcObject = null;
      document.getElementById('remoteVideo').srcObject = null;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
