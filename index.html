<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>シークレット通信網 - 道下特設ポータル</title>
  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background: linear-gradient(180deg, #7dd3fc 0%, #bae6fd 40%, #86efac 75%, #4ade80 100%);
      background-attachment: fixed;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .app-container {
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(14px);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 22px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      transition: all 0.3s ease;
    }

    .app-container.mode-mobile {
      max-width: 420px;
      height: 92vh;
      max-height: 820px;
    }

    .app-container.mode-pc {
      max-width: 860px;
      height: 88vh;
      max-height: 650px;
    }

    /* モーダル */
    .custom-modal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(6px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 360px;
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      border: 2px solid #e0f2fe;
    }
    .modal-title {
      font-size: 18px;
      font-weight: 900;
      color: #0284c7;
      margin-bottom: 6px;
    }
    .modal-desc {
      font-size: 12.5px;
      color: #64748b;
      margin-bottom: 16px;
      line-height: 1.5;
    }
    .modal-input {
      width: 100%;
      height: 44px;
      border: 2px solid #bae6fd;
      border-radius: 22px;
      padding: 0 16px;
      font-size: 14px;
      font-weight: 800;
      color: #0284c7;
      text-align: center;
      outline: none;
      background: #f8fafc;
      margin-bottom: 12px;
    }

    /* ヘッダー */
    .app-header {
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(226, 232, 240, 0.8);
      flex-shrink: 0;
    }
    .logo-area {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 900;
      font-size: 13px;
      color: #0284c7;
    }
    .user-avatar-head {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #0284c7;
    }
    .header-actions {
      display: flex;
      gap: 4px;
      align-items: center;
    }
    .header-btn {
      background: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      color: #334155;
      font-size: 10px;
      font-weight: 800;
      padding: 5px 8px;
      border-radius: 10px;
      cursor: pointer;
    }
    .btn-panic {
      background: #ef4444 !important;
      color: #ffffff !important;
      border-color: #dc2626 !important;
    }

    /* タブバー（要求通りの4つ） */
    .tab-bar {
      display: flex;
      background: #f1f5f9;
      padding: 6px;
      gap: 4px;
      border-bottom: 1px solid #e2e8f0;
      flex-shrink: 0;
    }
    .tab-item {
      flex: 1;
      text-align: center;
      padding: 8px 0;
      font-size: 11px;
      font-weight: 800;
      color: #64748b;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.15s;
      position: relative;
    }
    .tab-item.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
    }
    .tab-item.disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .tab-unread-dot {
      position: absolute;
      top: 4px;
      right: 6px;
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      display: none;
    }
    .tab-unread-dot.show { display: inline-block; }

    /* ビュー切り替えコンテナ */
    .view-content {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
      background: #f8fafc;
      min-height: 0;
    }
    .view-content.active { display: flex; }

    /* メッセージエリア */
    .messages-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
      min-height: 0;
    }
    
    .chat-row {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      max-width: 88%;
      touch-action: pan-y;
      transition: transform 0.15s ease-out;
    }
    .chat-row.mine {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid #bae6fd;
      flex-shrink: 0;
    }

    .chat-bubble {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      padding: 10px 14px;
      border-radius: 16px;
      word-break: break-all;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      display: flex;
      flex-direction: column;
      gap: 4px;
      width: 100%;
    }
    .chat-row.mine .chat-bubble {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border-color: #0284c7;
    }

    .bubble-name {
      font-size: 10.5px;
      color: #64748b;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .chat-row.mine .bubble-name { color: #bae6fd; }
    
    .reply-quote {
      background: rgba(0, 0, 0, 0.04);
      border-left: 3px solid #0284c7;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      color: #475569;
    }
    .chat-row.mine .reply-quote {
      background: rgba(255, 255, 255, 0.15);
      border-left-color: #e0f2fe;
      color: #f1f5f9;
    }

    .chat-img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 10px;
      cursor: pointer;
    }

    .bubble-text {
      font-size: 13.5px;
      line-height: 1.4;
      font-weight: 700;
    }

    /* フッター（既読・返信・取消・リアクションを一括配置） */
    .bubble-footer {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-top: 4px;
      border-top: 1px solid rgba(0,0,0,0.05);
      padding-top: 6px;
    }
    .chat-row.mine .bubble-footer { border-top-color: rgba(255,255,255,0.15); }

    .msg-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .msg-action-btn {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
    }
    .chat-row.mine .msg-action-btn { color: #e0f2fe; }

    /* リアクション（同一行に並べる） */
    .reaction-bar {
      display: flex;
      gap: 3px;
      align-items: center;
    }
    .reaction-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 1px 5px;
      font-size: 10.5px;
      font-weight: 800;
      cursor: pointer;
      color: #334155;
    }
    .reaction-btn.active {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0284c7;
    }
    .chat-row.mine .reaction-btn {
      background: rgba(255,255,255,0.2);
      border-color: rgba(255,255,255,0.4);
      color: #fff;
    }

    .read-counter {
      font-size: 10px;
      color: #64748b;
      font-weight: 700;
    }
    .chat-row.mine .read-counter { color: #bae6fd; }

    .replying-bar {
      display: none;
      background: #f1f5f9;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 800;
      color: #475569;
      border-top: 1px solid #e2e8f0;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    /* 入力エリア */
    .input-box-area {
      padding: 12px 16px;
      background: #ffffff;
      display: flex;
      gap: 8px;
      border-top: 1.5px solid #e2e8f0;
      flex-shrink: 0;
    }
    .text-input {
      flex: 1;
      height: 42px;
      border: 2px solid #bae6fd;
      border-radius: 21px;
      padding: 0 16px;
      outline: none;
      font-size: 14px;
      font-weight: 700;
      background: #f8fafc;
      color: #1e293b;
    }
    .text-input:focus { border-color: #0284c7; background: #ffffff; }

    .btn-clean {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      padding: 0 18px;
      height: 42px;
      border-radius: 21px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      white-space: nowrap;
    }
    .btn-icon {
      background: #e0f2fe;
      color: #0284c7;
      border: none;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* DMリスト */
    .dm-layout {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 0;
    }
    .user-list-pane {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      min-height: 0;
    }
    .user-item {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      padding: 12px 16px;
      border-radius: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .unread-red-dot {
      width: 9px;
      height: 9px;
      background-color: #ef4444;
      border-radius: 50%;
      display: inline-block;
    }

    .status-indicator {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }
    .status-indicator.online { background-color: #10b981; box-shadow: 0 0 6px #10b981; }
    .status-indicator.offline { background-color: #94a3b8; }

    /* 設定タブ用スタイル */
    .settings-pane {
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .setting-card {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .setting-title {
      font-weight: 900;
      font-size: 14px;
      color: #0284c7;
    }
    .preset-btn-group {
      display: flex;
      gap: 8px;
    }
  </style>
</head>
<body class="mode-mobile" id="bodyRoot">

  <!-- 初回名前モーダル -->
  <div id="nameModal" class="custom-modal">
    <div class="modal-card">
      <div class="modal-title">🔐 道下登録</div>
      <div class="modal-desc">通信網で使用するあなたの名前（道下ネーム）を決めてください。</div>
      <input type="text" id="initialNameInput" class="modal-input" placeholder="例: 道下ファン" maxlength="10">
      <button class="btn-clean" style="width: 100%; height: 44px; border-radius: 22px;" onclick="saveInitialName()">通信網に参加する</button>
    </div>
  </div>

  <!-- 画像送信プレビュー確認モーダル -->
  <div id="imgConfirmModal" class="custom-modal" style="display: none;">
    <div class="modal-card">
      <div class="modal-title">📷 画像送信の確認</div>
      <div class="modal-desc">この画像を送信してもよろしいですか？</div>
      <img id="imgPreviewTarget" style="max-width: 100%; max-height: 200px; border-radius: 12px; margin-bottom: 14px;">
      <div style="display: flex; gap: 8px;">
        <button class="btn-clean" style="flex:1; background: #64748b;" onclick="cancelImageSend()">キャンセル</button>
        <button class="btn-clean" style="flex:1;" onclick="confirmImageSend()">送信する</button>
      </div>
    </div>
  </div>

  <div class="app-container mode-mobile" id="appContainer">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="logo-area">
        <img id="headerUserAvatar" class="user-avatar-head" src="" alt="Icon">
        <span id="headerUserTag">道下: 読み込み中...</span>
      </div>
      <div class="header-actions">
        <button class="header-btn btn-panic" onclick="triggerPanic()">🚨 逃走 (Esc)</button>
        <button class="header-btn" id="soundToggleBtn" onclick="toggleSound()">🔇ミュート</button>
        <button class="header-btn" onclick="requestNotificationPermission()">🔔通知</button>
        <button class="header-btn" id="ratioToggleBtn" onclick="toggleScreenMode()">💻PC</button>
      </div>
    </header>

    <!-- タブバー（指定の4つ） -->
    <div class="tab-bar">
      <div class="tab-item active" onclick="switchTab('channel')">💬 全体</div>
      <div class="tab-item" onclick="switchTab('dm')">
        ✉️ 個人
        <span class="tab-unread-dot" id="tabUnreadDot"></span>
      </div>
      <div class="tab-item disabled" onclick="alert('通話機能は現在使用不可です')">📞 通話(使用不可)</div>
      <div class="tab-item" onclick="switchTab('settings')">⚙️ 設定</div>
    </div>

    <!-- ================= 1. 全体チャンネル ================= -->
    <div id="viewChannel" class="view-content active">
      <div class="messages-area" id="channelMessages"></div>
      <div id="replyingBar" class="replying-bar">
        <span id="replyingText"></span>
        <button onclick="cancelReply()" style="background:none; border:none; font-weight:900; cursor:pointer; color:#ef4444;">✕ 取消</button>
      </div>
      <div class="input-box-area">
        <input type="file" id="channelImgInput" accept="image/*" style="display: none;" onchange="handleFileSelect(this, 'channel')">
        <button class="btn-icon" onclick="playTapSound(); document.getElementById('channelImgInput').click()">📷</button>
        <input type="text" id="channelInput" class="text-input" placeholder="全体メッセージ..." onkeydown="if(event.key==='Enter') sendChannelMsg()">
        <button class="btn-clean" onclick="sendChannelMsg()">送信</button>
      </div>
    </div>

    <!-- ================= 2. 個人チャット (DM) ================= -->
    <div id="viewDm" class="view-content">
      <div class="dm-layout" id="dmUserListLayout">
        <div style="padding: 12px 16px 6px; font-weight: 900; font-size: 13px; color: #64748b; flex-shrink: 0;">道下ファン一覧</div>
        <div class="user-list-pane" id="onlineUserListContainer"></div>
      </div>
      <div class="dm-layout" id="dmChatRoomLayout" style="display: none;">
        <div style="background: #ffffff; padding: 8px 16px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;">
          <button class="btn-clean" style="height: 30px; padding: 0 10px; font-size: 11.5px; background: #64748b;" onclick="playTapSound(); backToUserList()">← 戻る</button>
          <div id="activeDmTitle" style="font-weight: 900; font-size: 13.5px; color: #0284c7;"></div>
          <div style="width: 45px;"></div>
        </div>
        <div class="messages-area" id="dmMessagesContainer"></div>
        <div id="dmReplyingBar" class="replying-bar" style="display: none;">
          <span id="dmReplyingText"></span>
          <button onclick="cancelReply()" style="background:none; border:none; font-weight:900; cursor:pointer; color:#ef4444;">✕ 取消</button>
        </div>
        <div class="input-box-area">
          <input type="file" id="dmImgInput" accept="image/*" style="display: none;" onchange="handleFileSelect(this, 'dm')">
          <button class="btn-icon" onclick="playTapSound(); document.getElementById('dmImgInput').click()">📷</button>
          <input type="text" id="dmInput" class="text-input" placeholder="DMを入力..." onkeydown="if(event.key==='Enter') sendDmMsg()">
          <button class="btn-clean" onclick="sendDmMsg()">送信</button>
        </div>
      </div>
    </div>

    <!-- ================= 3. 設定タブ ================= -->
    <div id="viewSettings" class="view-content">
      <div class="settings-pane">
        <div class="setting-card">
          <div class="setting-title">👤 プロフィール・アイコン設定</div>
          
          <div style="display:flex; align-items:center; gap:12px;">
            <img id="settingsAvatarPreview" style="width:50px; height:50px; border-radius:50%; object-fit:cover; border:2px solid #0284c7;">
            <div>
              <div style="font-size:12px; color:#64748b; font-weight:800;">アイコン画像URLを入力</div>
              <input type="text" id="iconUrlInput" class="modal-input" placeholder="https://..." style="margin-bottom:0; text-align:left; font-size:12px;">
            </div>
          </div>

          <div style="display:flex; gap:6px;">
            <button class="btn-clean" style="flex:1; font-size:11px;" onclick="applyCustomIcon()">画像を移動・変更</button>
            <button class="btn-clean" style="flex:1; background:#ef4444; font-size:11px;" onclick="resetToDefaultIcon()">画像を削除（初期化）</button>
          </div>

          <!-- 初期アイコンパターン選択 -->
          <div style="border-top:1px solid #e2e8f0; padding-top:10px;">
            <div style="font-size:11px; color:#64748b; font-weight:800; margin-bottom:6px;">初期アイコンプリセット</div>
            <div class="preset-btn-group">
              <button class="btn-clean" style="flex:1; background:#0284c7; font-size:10.5px;" onclick="setPresetIcon(1)">パターン1 (ブルー)</button>
              <button class="btn-clean" style="flex:1; background:#10b981; font-size:10.5px;" onclick="setPresetIcon(2)">パターン2 (グリーン)</button>
            </div>
          </div>
        </div>

        <div class="setting-card">
          <div class="setting-title">✏️ 名前変更</div>
          <input type="text" id="settingNameInput" class="modal-input" maxlength="10">
          <button class="btn-clean" onclick="updateNameFromSettings()">名前を保存</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // --- 初期アイコンのURL定義（2パターン） ---
    // [HTML内の設定欄]: ここに初期アイコンの画像URLを挿入・設定できます
    const DEFAULT_ICON_1 = "https://api.dicebear.com/7.x/bottts/svg?seed=Michishita1";
    const DEFAULT_ICON_2 = "https://api.dicebear.com/7.x/bottts/svg?seed=Michishita2";

    const STORAGE_NAME_KEY = 'SECRET_NETWORK_AGENT_NAME_V1';
    const STORAGE_ICON_KEY = 'SECRET_NETWORK_AGENT_ICON_V1';

    let myName = localStorage.getItem(STORAGE_NAME_KEY) || "";
    let myIcon = localStorage.getItem(STORAGE_ICON_KEY) || DEFAULT_ICON_1;

    const firebaseConfig = {
      databaseURL: "https://michishita-typing-94d91-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let currentActiveDmUser = null;
    let isPcMode = false;
    let isSoundOn = localStorage.getItem('SECRET_NETWORK_SOUND') === 'ON';
    let replyingTo = null;
    let pendingImageData = null;
    let pendingImageMode = null;

    // --- ESCキー逃走機能 ---
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        triggerPanic();
      }
    });

    // --- 緊急逃走（別タブでClassroomを開く） ---
    function triggerPanic() {
      window.open("https://classroom.google.com", "_blank");
    }

    // --- 音声 (Web Audio API) ---
    let audioCtx = null;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playBeep(freq, type = 'sine', duration = 0.08, vol = 0.1) {
      if (!isSoundOn) return;
      initAudio();
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(vol, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }
    function playTapSound() { playBeep(600, 'triangle', 0.04, 0.05); }
    function playSendSound() { playBeep(900, 'sine', 0.08, 0.1); }
    function playReceiveSound() { playBeep(800, 'sine', 0.08, 0.1); setTimeout(() => playBeep(1100, 'sine', 0.12, 0.12), 100); }

    function toggleSound() {
      isSoundOn = !isSoundOn;
      localStorage.setItem('SECRET_NETWORK_SOUND', isSoundOn ? 'ON' : 'OFF');
      document.getElementById('soundToggleBtn').innerText = isSoundOn ? '🔊音ON' : '🔇ミュート';
      if (isSoundOn) playTapSound();
    }

    function requestNotificationPermission() {
      if (!("Notification" in window)) return;
      Notification.requestPermission().then(p => { if (p === "granted") alert("通知が許可されました！"); });
    }

    function showBrowserNotification(title, bodyText) {
      if (Notification.permission === "granted" && document.hidden) {
        new Notification(title, { body: bodyText, icon: "https://cdn-icons-png.flaticon.com/512/3067/3067400.png" });
      }
    }

    window.onload = function() {
      document.getElementById('soundToggleBtn').innerText = isSoundOn ? '🔊音ON' : '🔇ミュート';
      updateAvatarDisplays();
      if (myName) {
        document.getElementById('nameModal').style.display = 'none';
        initApp();
      }
    };

    function updateAvatarDisplays() {
      document.getElementById('headerUserAvatar').src = myIcon;
      document.getElementById('settingsAvatarPreview').src = myIcon;
      document.getElementById('iconUrlInput').value = myIcon;
    }

    function saveInitialName() {
      const input = document.getElementById('initialNameInput').value.trim();
      if (!input) return alert("名前を入力してください！");
      playTapSound();
      myName = input.substring(0, 10);
      localStorage.setItem(STORAGE_NAME_KEY, myName);
      document.getElementById('nameModal').style.display = 'none';
      initApp();
    }

    function toggleScreenMode() {
      playTapSound();
      isPcMode = !isPcMode;
      const container = document.getElementById('appContainer');
      const btn = document.getElementById('ratioToggleBtn');
      if (isPcMode) {
        container.classList.remove('mode-mobile'); container.classList.add('mode-pc');
        btn.innerText = "📱スマホ";
      } else {
        container.classList.remove('mode-pc'); container.classList.add('mode-mobile');
        btn.innerText = "💻PC";
      }
    }

    function initApp() {
      document.getElementById('headerUserTag').innerText = `道下: ${myName}`;
      document.getElementById('settingNameInput').value = myName;
      registerUserPresence();
      initChannelSync();
      initUserListSync();
    }

    function registerUserPresence() {
      const userRef = db.ref('secret_users/' + myName);
      userRef.set({ name: myName, icon: myIcon, lastActive: firebase.database.ServerValue.TIMESTAMP });
      if (window.presenceInterval) clearInterval(window.presenceInterval);
      window.presenceInterval = setInterval(() => {
        userRef.update({ lastActive: firebase.database.ServerValue.TIMESTAMP, icon: myIcon });
      }, 10000);
    }

    function switchTab(tabName) {
      if (tabName === 'call') return;
      playTapSound();
      const tabs = ['channel', 'dm', 'settings'];
      tabs.forEach((t) => {
        const el = document.getElementById('view' + t.charAt(0).toUpperCase() + t.slice(1));
        if (el) el.classList.remove('active');
      });
      document.querySelectorAll('.tab-item').forEach(i => i.classList.remove('active'));
      
      if (tabName === 'channel') document.querySelectorAll('.tab-item')[0].classList.add('active');
      if (tabName === 'dm') document.querySelectorAll('.tab-item')[1].classList.add('active');
      if (tabName === 'settings') document.querySelectorAll('.tab-item')[3].classList.add('active');

      document.getElementById('view' + tabName.charAt(0).toUpperCase() + tabName.slice(1)).classList.add('active');
    }

    // --- アイコン設定処理 ---
    function applyCustomIcon() {
      const url = document.getElementById('iconUrlInput').value.trim();
      if (!url) return alert("URLを入力してください");
      myIcon = url;
      localStorage.setItem(STORAGE_ICON_KEY, myIcon);
      updateAvatarDisplays();
      registerUserPresence();
      alert("アイコンを変更しました！");
    }

    function resetToDefaultIcon() {
      myIcon = DEFAULT_ICON_1;
      localStorage.setItem(STORAGE_ICON_KEY, myIcon);
      updateAvatarDisplays();
      registerUserPresence();
      alert("初期アイコンに戻しました！");
    }

    function setPresetIcon(num) {
      myIcon = num === 1 ? DEFAULT_ICON_1 : DEFAULT_ICON_2;
      localStorage.setItem(STORAGE_ICON_KEY, myIcon);
      updateAvatarDisplays();
      registerUserPresence();
      alert(`初期アイコンパターン${num}に設定しました！`);
    }

    function updateNameFromSettings() {
      const newName = document.getElementById('settingNameInput').value.trim();
      if (!newName) return alert("名前を入力してください");
      myName = newName.substring(0, 10);
      localStorage.setItem(STORAGE_NAME_KEY, myName);
      document.getElementById('headerUserTag').innerText = `道下: ${myName}`;
      registerUserPresence();
      alert("名前を変更しました！");
    }

    // --- 返信設定 ---
    function setReply(name, text) {
      playTapSound();
      replyingTo = { name, text };
      const barText = `↩️ ${name} さんへ返信: "${text.substring(0, 15)}..."`;
      document.getElementById('replyingText').innerText = barText;
      document.getElementById('replyingBar').style.display = 'flex';
      document.getElementById('dmReplyingText').innerText = barText;
      document.getElementById('dmReplyingBar').style.display = 'flex';
    }

    function cancelReply() {
      playTapSound();
      replyingTo = null;
      document.getElementById('replyingBar').style.display = 'none';
      document.getElementById('dmReplyingBar').style.display = 'none';
    }

    // --- リアクション処理 ---
    function toggleReaction(path, msgKey, emoji) {
      playTapSound();
      const ref = db.ref(`${path}/${msgKey}/reactions/${emoji}`);
      ref.once('value', (snap) => {
        const users = snap.val() || {};
        if (users[myName]) ref.child(myName).remove();
        else ref.child(myName).set(true);
      });
    }

    // --- 全体チャット同期 ---
    let lastChannelMsgCount = null;
    function initChannelSync() {
      const container = document.getElementById('channelMessages');
      db.ref('secret_channel').limitToLast(50).on('value', (snapshot) => {
        container.innerHTML = '';
        const data = snapshot.val() || {};
        const entries = Object.entries(data);

        if (lastChannelMsgCount !== null && entries.length > lastChannelMsgCount) {
          const latest = entries[entries.length - 1][1];
          if (latest.name !== myName) {
            playReceiveSound();
            showBrowserNotification(`[全体] ${latest.name}さん`, latest.type === 'image' ? '画像' : latest.text);
          }
        }
        lastChannelMsgCount = entries.length;

        entries.forEach(([key, msg]) => {
          container.appendChild(createMessageElement(key, msg, 'secret_channel'));
        });
        container.scrollTop = container.scrollHeight;
      });
    }

    function sendChannelMsg() {
      const input = document.getElementById('channelInput');
      const text = input.value.trim();
      if (!text && !replyingTo) return;
      playSendSound();
      db.ref('secret_channel').push({
        name: myName,
        icon: myIcon,
        text: text || "",
        type: 'text',
        replyTo: replyingTo ? { name: replyingTo.name, text: replyingTo.text } : null,
        time: new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'})
      });
      input.value = '';
      cancelReply();
    }

    // --- メッセージ要素生成 ＆ スライド返信ロジック ---
    function createMessageElement(key, msg, path) {
      const isMine = msg.name === myName;
      const row = document.createElement('div');
      row.className = `chat-row ${isMine ? 'mine' : ''}`;

      // アタッチされたスライド（ドラッグ）返信機能
      let startX = 0;
      row.addEventListener('touchstart', (e) => { startX = e.touches[0].clientX; });
      row.addEventListener('touchmove', (e) => {
        const diff = e.touches[0].clientX - startX;
        if (diff > 40) {
          row.style.transform = `translateX(${Math.min(diff, 80)}px)`;
        }
      });
      row.addEventListener('touchend', (e) => {
        if (row.style.transform.includes('px')) {
          row.style.transform = 'translateX(0px)';
          setReply(msg.name, msg.text || '画像');
        }
      });

      const iconUrl = msg.icon || DEFAULT_ICON_1;
      let html = `<img src="${iconUrl}" class="msg-avatar">`;
      html += `<div class="chat-bubble">`;
      html += `<div class="bubble-name"><span>${msg.name}</span><span>${msg.time}</span></div>`;

      if (msg.replyTo) {
        html += `<div class="reply-quote">↩️ ${msg.replyTo.name}: ${escapeHtml(msg.replyTo.text)}</div>`;
      }

      if (msg.type === 'image') {
        html += `<img src="${msg.data}" class="chat-img" onclick="window.open('${msg.data}')">`;
      } else {
        html += `<div class="bubble-text">${escapeHtml(msg.text)}</div>`;
      }

      // フッター（既読・返信・取消・リアクションを横一列に配置）
      const reactions = msg.reactions || {};
      const emojis = ['👍', '🔥', '草', '❤️'];
      
      html += `<div class="bubble-footer">`;
      html += `<div class="msg-actions">`;
      html += `<button class="msg-action-btn" onclick="setReply('${msg.name}', '${msg.text || '画像'}')">↩️返信</button>`;
      if (isMine) {
        html += `<button class="msg-action-btn" onclick="deleteMsg('${path}', '${key}')">🗑️取消</button>`;
      }
      
      // 自分のメッセージにはリアクション不可
      if (!isMine) {
        html += `<div class="reaction-bar">`;
        emojis.forEach(e => {
          const count = Object.keys(reactions[e] || {}).length;
          const active = (reactions[e] || {})[myName] ? 'active' : '';
          html += `<button class="reaction-btn ${active}" onclick="toggleReaction('${path}', '${key}', '${e}')">${e}${count > 0 ? count : ''}</button>`;
        });
        html += `</div>`;
      }
      html += `</div>`;

      html += `<div class="read-counter">${isMine ? '既読' : ''}</div>`;
      html += `</div></div>`;

      row.innerHTML = html;
      return row;
    }

    function deleteMsg(path, msgKey) {
      if (confirm("取り消しますか？")) {
        playTapSound();
        db.ref(`${path}/${msgKey}`).remove();
      }
    }

    // --- DM同期 ---
    function initUserListSync() {
      const container = document.getElementById('onlineUserListContainer');
      const tabUnreadDot = document.getElementById('tabUnreadDot');
      
      db.ref('secret_users').on('value', (userSnap) => {
        const users = userSnap.val() || {};
        db.ref('secret_dms').on('value', (dmSnap) => {
          const allDms = dmSnap.val() || {};
          container.innerHTML = '';
          const now = Date.now();
          let anyUnread = false;

          Object.values(users).forEach(u => {
            if (u.name === myName) return;
            const isOnline = u.lastActive && (now - u.lastActive < 25000);
            const roomId = getDmRoomId(myName, u.name);
            const roomMsgs = allDms[roomId] || {};
            const msgKeys = Object.keys(roomMsgs);
            
            let hasUnread = false;
            if (msgKeys.length > 0) {
              const lastMsg = roomMsgs[msgKeys[msgKeys.length - 1]];
              const lastReadTime = Number(localStorage.getItem('LAST_READ_' + roomId) || 0);
              if (lastMsg.name !== myName && lastMsg.rawTime > lastReadTime) {
                hasUnread = true; anyUnread = true;
              }
            }

            const div = document.createElement('div');
            div.className = 'user-item';
            div.innerHTML = `
              <div style="display: flex; align-items: center; gap: 10px;">
                <img src="${u.icon || DEFAULT_ICON_1}" style="width:28px; height:28px; border-radius:50%; object-fit:cover;">
                <span class="status-indicator ${isOnline ? 'online' : 'offline'}"></span>
                <span>${u.name}</span>
                ${hasUnread ? '<span class="unread-red-dot"></span>' : ''}
              </div>
              <span style="font-size: 11px; color: #0284c7;">チャットを開く →</span>
            `;
            div.onclick = () => { playTapSound(); openDmChat(u.name); };
            container.appendChild(div);
          });
          if (anyUnread) tabUnreadDot.classList.add('show'); else tabUnreadDot.classList.remove('show');
        });
      });
    }

    function getDmRoomId(userA, userB) { return [userA, userB].sort().join('_'); }

    function openDmChat(targetName) {
      currentActiveDmUser = targetName;
      document.getElementById('activeDmTitle').innerText = `${targetName} とのDM`;
      document.getElementById('dmUserListLayout').style.display = 'none';
      document.getElementById('dmChatRoomLayout').style.display = 'flex';
      const roomId = getDmRoomId(myName, targetName);
      localStorage.setItem('LAST_READ_' + roomId, Date.now());
      initDmSync();
    }

    function backToUserList() {
      currentActiveDmUser = null;
      document.getElementById('dmChatRoomLayout').style.display = 'none';
      document.getElementById('dmUserListLayout').style.display = 'flex';
    }

    let lastDmMsgCount = {};
    function initDmSync() {
      if (!currentActiveDmUser) return;
      const roomId = getDmRoomId(myName, currentActiveDmUser);
      const container = document.getElementById('dmMessagesContainer');

      db.ref('secret_dms/' + roomId).limitToLast(50).on('value', (snapshot) => {
        container.innerHTML = '';
        const data = snapshot.val() || {};
        const entries = Object.entries(data);

        if (lastDmMsgCount[roomId] !== undefined && entries.length > lastDmMsgCount[roomId]) {
          const latest = entries[entries.length - 1][1];
          if (latest.name !== myName) {
            playReceiveSound();
            showBrowserNotification(`[DM] ${latest.name}さん`, latest.type === 'image' ? '画像' : latest.text);
          }
        }
        lastDmMsgCount[roomId] = entries.length;

        entries.forEach(([key, msg]) => {
          container.appendChild(createMessageElement(key, msg, `secret_dms/${roomId}`));
        });
        container.scrollTop = container.scrollHeight;
      });
    }

    function sendDmMsg() {
      if (!currentActiveDmUser) return;
      const input = document.getElementById('dmInput');
      const text = input.value.trim();
      if (!text && !replyingTo) return;
      playSendSound();
      const roomId = getDmRoomId(myName, currentActiveDmUser);
      const now = Date.now();
      db.ref('secret_dms/' + roomId).push({
        name: myName,
        icon: myIcon,
        text: text || "",
        type: 'text',
        replyTo: replyingTo ? { name: replyingTo.name, text: replyingTo.text } : null,
        rawTime: now,
        time: new Date(now).toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'})
      });
      localStorage.setItem('LAST_READ_' + roomId, now);
      input.value = '';
      cancelReply();
    }

    // --- 画像選択と誤送信防止プレビュー ---
    function handleFileSelect(inputElement, mode) {
      const file = inputElement.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 450;
          let width = img.width, height = img.height;
          if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          canvas.width = width; canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          
          pendingImageData = canvas.toDataURL('image/jpeg', 0.7);
          pendingImageMode = mode;
          
          document.getElementById('imgPreviewTarget').src = pendingImageData;
          document.getElementById('imgConfirmModal').style.display = 'flex';
        }
        img.src = e.target.result;
      }
      reader.readAsDataURL(file);
      inputElement.value = '';
    }

    function cancelImageSend() {
      playTapSound();
      pendingImageData = null;
      pendingImageMode = null;
      document.getElementById('imgConfirmModal').style.display = 'none';
    }

    function confirmImageSend() {
      if (!pendingImageData) return;
      playSendSound();
      const now = Date.now();
      const payload = {
        name: myName,
        icon: myIcon,
        data: pendingImageData,
        type: 'image',
        rawTime: now,
        time: new Date(now).toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'})
      };

      if (pendingImageMode === 'channel') {
        db.ref('secret_channel').push(payload);
      } else if (pendingImageMode === 'dm' && currentActiveDmUser) {
        const roomId = getDmRoomId(myName, currentActiveDmUser);
        db.ref('secret_dms/' + roomId).push(payload);
        localStorage.setItem('LAST_READ_' + roomId, now);
      }
      cancelImageSend();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
