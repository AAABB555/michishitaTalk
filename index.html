<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>シークレット通信網 - Secret Network</title>
  <!-- Firebase CDN -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <!-- PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background: linear-gradient(180deg, #7dd3fc 0%, #bae6fd 40%, #86efac 75%, #4ade80 100%);
      background-attachment: fixed;
      color: #1e293b;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    /* メインアプリコンテナ（PC 16:9風 / スマホ 9:16風に美しく収まるカード） */
    .app-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      max-height: 850px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(14px);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* --- 名前設定モーダル --- */
    #nameModal {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-card {
      background: #ffffff;
      width: 100%;
      border-radius: 22px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      border: 2px solid #e0f2fe;
    }
    .modal-title {
      font-size: 20px;
      font-weight: 900;
      color: #0284c7;
      margin-bottom: 8px;
    }
    .modal-desc {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .modal-input {
      width: 100%;
      height: 48px;
      border: 2px solid #bae6fd;
      border-radius: 24px;
      padding: 0 16px;
      font-size: 16px;
      font-weight: 800;
      color: #0284c7;
      text-align: center;
      outline: none;
      background: #f8fafc;
      margin-bottom: 16px;
    }
    .modal-input:focus {
      border-color: #0284c7;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.2);
    }

    /* ヘッダー */
    .app-header {
      background: rgba(255, 255, 255, 0.95);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid rgba(226, 232, 240, 0.8);
    }
    .logo-area {
      font-weight: 900;
      font-size: 16px;
      color: #0284c7;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .user-tag {
      font-size: 12px;
      font-weight: 800;
      background: rgba(2, 132, 199, 0.1);
      color: #0284c7;
      padding: 4px 10px;
      border-radius: 12px;
    }

    /* タブバー */
    .tab-bar {
      display: flex;
      background: #f1f5f9;
      padding: 6px;
      gap: 4px;
      border-bottom: 1px solid #e2e8f0;
    }
    .tab-item {
      flex: 1;
      text-align: center;
      padding: 10px 0;
      font-size: 12.5px;
      font-weight: 800;
      color: #64748b;
      cursor: pointer;
      border-radius: 10px;
      transition: all 0.15s;
    }
    .tab-item.active {
      background: #0284c7;
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
    }

    /* ビュー切り替え */
    .view-content {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
      background: #f8fafc;
    }
    .view-content.active {
      display: flex;
    }

    /* --- チャット・DM共通 --- */
    .messages-area {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .chat-bubble {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      padding: 10px 14px;
      border-radius: 16px;
      max-width: 80%;
      word-break: break-all;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }
    .chat-bubble.mine {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      align-self: flex-end;
      border-color: #0284c7;
    }
    .bubble-name {
      font-size: 10.5px;
      color: #64748b;
      margin-bottom: 3px;
      font-weight: 800;
    }
    .chat-bubble.mine .bubble-name { color: #bae6fd; text-align: right; }
    .chat-img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 10px;
      margin-top: 6px;
      cursor: pointer;
    }

    .input-box-area {
      padding: 12px 16px;
      background: #ffffff;
      display: flex;
      gap: 8px;
      border-top: 1.5px solid #e2e8f0;
    }
    .text-input {
      flex: 1;
      height: 44px;
      border: 2px solid #bae6fd;
      border-radius: 22px;
      padding: 0 16px;
      outline: none;
      font-size: 14px;
      font-weight: 700;
      background: #f8fafc;
      color: #1e293b;
    }
    .text-input:focus { border-color: #0284c7; background: #ffffff; }

    .btn-clean {
      background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
      color: #ffffff;
      border: none;
      padding: 0 18px;
      height: 44px;
      border-radius: 22px;
      font-weight: 900;
      font-size: 13.5px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
      white-space: nowrap;
    }
    .btn-icon {
      background: #e0f2fe;
      color: #0284c7;
      border: none;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* --- DMユーザーリスト画面 --- */
    .dm-layout {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    .user-list-pane {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
    }
    .user-item {
      background: #ffffff;
      border: 1.5px solid #e2e8f0;
      padding: 14px 18px;
      border-radius: 14px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: transform 0.1s;
    }
    .user-item:hover { transform: translateY(-2px); border-color: #0284c7; }

    /* --- 通話ビュー --- */
    .call-pane {
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      height: 100%;
    }
    .video-grid-box {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      width: 100%;
      max-width: 400px;
    }
    .video-card {
      background: #0f172a;
      border-radius: 14px;
      aspect-ratio: 16/9;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      border: 2px solid #cbd5e1;
    }
    .video-card video { width: 100%; height: 100%; object-fit: cover; }
    .video-tag {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <!-- 名前の初期設定モーダル -->
  <div id="nameModal">
    <div class="modal-card">
      <div class="modal-title">🔐 エージェント登録</div>
      <div class="modal-desc">通信網で使用するあなたの名前（エージェント名）を決めてください。</div>
      <input type="text" id="initialNameInput" class="modal-input" placeholder="例: 道下ファン" maxlength="10">
      <button class="btn-clean" style="width: 100%; height: 48px; border-radius: 24px;" onclick="saveInitialName()">通信網に参加する</button>
    </div>
  </div>

  <div class="app-container">
    <!-- ヘッダー -->
    <header class="app-header">
      <div class="logo-area">
        <span>💬 シークレット通信網</span>
      </div>
      <div class="user-tag" id="headerUserTag">設定中...</div>
    </header>

    <!-- タブバー -->
    <div class="tab-bar">
      <div class="tab-item active" onclick="switchTab('channel')">💬 全体チャンネル</div>
      <div class="tab-item" onclick="switchTab('dm')">✉️ 個人チャット</div>
      <div class="tab-item" onclick="switchTab('call')">📞 通話</div>
    </div>

    <!-- ================= 1. 全体チャンネル ================= -->
    <div id="viewChannel" class="view-content active">
      <div class="messages-area" id="channelMessages"></div>
      <div class="input-box-area">
        <input type="file" id="channelImgInput" accept="image/*" style="display: none;" onchange="sendImage(this, 'channel')">
        <button class="btn-icon" onclick="document.getElementById('channelImgInput').click()">📷</button>
        <input type="text" id="channelInput" class="text-input" placeholder="メッセージを入力..." onkeydown="if(event.key==='Enter') sendChannelMsg()">
        <button class="btn-clean" onclick="sendChannelMsg()">送信</button>
      </div>
    </div>

    <!-- ================= 2. 個人チャット (DM) ================= -->
    <div id="viewDm" class="view-content">
      <div class="dm-layout" id="dmUserListLayout">
        <div style="padding: 16px 16px 8px; font-weight: 900; font-size: 14px; color: #64748b;">オンラインのエージェント一覧</div>
        <div class="user-list-pane" id="onlineUserListContainer"></div>
      </div>
      <div class="dm-layout" id="dmChatRoomLayout" style="display: none;">
        <div style="background: #ffffff; padding: 10px 16px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: space-between;">
          <button class="btn-clean" style="height: 32px; padding: 0 12px; font-size: 12px; background: #64748b;" onclick="backToUserList()">← 戻る</button>
          <div id="activeDmTitle" style="font-weight: 900; font-size: 14px; color: #0284c7;"></div>
          <div style="width: 50px;"></div>
        </div>
        <div class="messages-area" id="dmMessagesContainer"></div>
        <div class="input-box-area">
          <input type="file" id="dmImgInput" accept="image/*" style="display: none;" onchange="sendImage(this, 'dm')">
          <button class="btn-icon" onclick="document.getElementById('dmImgInput').click()">📷</button>
          <input type="text" id="dmInput" class="text-input" placeholder="DMを入力..." onkeydown="if(event.key==='Enter') sendDmMsg()">
          <button class="btn-clean" onclick="sendDmMsg()">送信</button>
        </div>
      </div>
    </div>

    <!-- ================= 3. 通話タブ ================= -->
    <div id="viewCall" class="view-content">
      <div class="call-pane">
        <div class="video-grid-box">
          <div class="video-card">
            <video id="localVideo" autoplay muted playsinline></video>
            <div class="video-tag">自分</div>
          </div>
          <div class="video-card">
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="video-tag">相手</div>
          </div>
        </div>
        <div style="width: 100%; max-width: 400px; background: #ffffff; padding: 16px; border-radius: 16px; border: 1.5px solid #e2e8f0; text-align: center;">
          <div style="font-size: 12.5px; font-weight: 800; color: #64748b; margin-bottom: 8px;">相手のIDを入力して呼び出し</div>
          <input type="text" id="targetIdInput" class="text-input" placeholder="相手の名前(ID)" style="text-align: center; margin-bottom: 10px;">
          <div style="display: flex; gap: 8px;">
            <button class="btn-clean" style="flex:1; background: #10b981;" onclick="startCall(false)">音声通話</button>
            <button class="btn-clean" style="flex:1;" onclick="startCall(true)">ビデオ通話</button>
            <button class="btn-clean" style="background: #ef4444;" onclick="hangUp()">切断</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_NAME_KEY = 'SECRET_NETWORK_AGENT_NAME_V1';
    let myName = localStorage.getItem(STORAGE_NAME_KEY) || "";

    const firebaseConfig = {
      databaseURL: "https://michishita-typing-94d91-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let currentActiveDmUser = null;

    window.onload = function() {
      if (myName) {
        document.getElementById('nameModal').style.display = 'none';
        initApp();
      }
    };

    function saveInitialName() {
      const input = document.getElementById('initialNameInput').value.trim();
      if (!input) {
        alert("名前を入力してください！");
        return;
      }
      myName = input.substring(0, 10);
      localStorage.setItem(STORAGE_NAME_KEY, myName);
      document.getElementById('nameModal').style.display = 'none';
      initApp();
    }

    function initApp() {
      document.getElementById('headerUserTag').innerText = `ID: ${myName}`;
      registerUserPresence();
      initChannelSync();
      initUserListSync();
      initPeerJS();
    }

    // ユーザー一覧に自分を登録
    function registerUserPresence() {
      db.ref('secret_users/' + myName).set({
        name: myName,
        lastActive: Date.now()
      });
      db.ref('secret_users/' + myName).onDisconnect().remove();
    }

    // --- タブ切り替え ---
    function switchTab(tabName) {
      const tabs = ['channel', 'dm', 'call'];
      tabs.forEach((t, idx) => {
        document.querySelectorAll('.tab-item')[idx].classList.remove('active');
        document.getElementById('view' + t.charAt(0).toUpperCase() + t.slice(1)).classList.remove('active');
      });

      const activeIdx = tabs.indexOf(tabName);
      document.querySelectorAll('.tab-item')[activeIdx].classList.add('active');
      document.getElementById('view' + tabName.charAt(0).toUpperCase() + tabName.slice(1)).classList.add('active');
    }

    // --- 全体チャンネルチャット ---
    function initChannelSync() {
      const container = document.getElementById('channelMessages');
      db.ref('secret_channel').limitToLast(50).on('value', (snapshot) => {
        container.innerHTML = '';
        const data = snapshot.val() || {};
        Object.values(data).forEach(msg => {
          const div = document.createElement('div');
          const isMine = msg.name === myName;
          div.className = `chat-bubble ${isMine ? 'mine' : ''}`;
          
          let html = `<div class="bubble-name">${msg.name} (${msg.time})</div>`;
          if (msg.type === 'image') {
            html += `<img src="${msg.data}" class="chat-img" onclick="window.open('${msg.data}')">`;
          } else {
            html += `<div>${escapeHtml(msg.text)}</div>`;
          }
          div.innerHTML = html;
          container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
      });
    }

    function sendChannelMsg() {
      const input = document.getElementById('channelInput');
      const text = input.value.trim();
      if (!text) return;

      db.ref('secret_channel').push({
        name: myName,
        text: text,
        type: 'text',
        time: new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'})
      });
      input.value = '';
    }

    // --- 個人チャット (DM) ---
    function initUserListSync() {
      const container = document.getElementById('onlineUserListContainer');
      db.ref('secret_users').on('value', (snapshot) => {
        container.innerHTML = '';
        const users = snapshot.val() || {};
        Object.values(users).forEach(u => {
          if (u.name === myName) return; // 自分は除外
          const div = document.createElement('div');
          div.className = 'user-item';
          div.innerHTML = `<span>💬 ${u.name}</span> <span style="font-size: 11px; color: #0284c7;">チャットを開く →</span>`;
          div.onclick = () => openDmChat(u.name);
          container.appendChild(div);
        });
      });
    }

    function getDmRoomId(userA, userB) {
      return [userA, userB].sort().join('_');
    }

    function openDmChat(targetName) {
      currentActiveDmUser = targetName;
      document.getElementById('activeDmTitle').innerText = `${targetName} とのDM`;
      document.getElementById('dmUserListLayout').style.display = 'none';
      document.getElementById('dmChatRoomLayout').style.display = 'flex';
      initDmSync();
    }

    function backToUserList() {
      currentActiveDmUser = null;
      document.getElementById('dmChatRoomLayout').style.display = 'none';
      document.getElementById('dmUserListLayout').style.display = 'flex';
    }

    function initDmSync() {
      if (!currentActiveDmUser) return;
      const roomId = getDmRoomId(myName, currentActiveDmUser);
      const container = document.getElementById('dmMessagesContainer');

      db.ref('secret_dms/' + roomId).limitToLast(50).on('value', (snapshot) => {
        container.innerHTML = '';
        const data = snapshot.val() || {};
        Object.values(data).forEach(msg => {
          const div = document.createElement('div');
          const isMine = msg.name === myName;
          div.className = `chat-bubble ${isMine ? 'mine' : ''}`;
          
          let html = `<div class="bubble-name">${msg.name} (${msg.time})</div>`;
          if (msg.type === 'image') {
            html += `<img src="${msg.data}" class="chat-img" onclick="window.open('${msg.data}')">`;
          } else {
            html += `<div>${escapeHtml(msg.text)}</div>`;
          }
          div.innerHTML = html;
          container.appendChild(div);
        });
        container.scrollTop = container.scrollHeight;
      });
    }

    function sendDmMsg() {
      if (!currentActiveDmUser) return;
      const input = document.getElementById('dmInput');
      const text = input.value.trim();
      if (!text) return;

      const roomId = getDmRoomId(myName, currentActiveDmUser);
      db.ref('secret_dms/' + roomId).push({
        name: myName,
        text: text,
        type: 'text',
        time: new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'})
      });
      input.value = '';
    }

    // --- 写真送信機能 (共通) ---
    function sendImage(inputElement, mode) {
      const file = inputElement.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 450;
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) {
            height *= MAX_WIDTH / width;
            width = MAX_WIDTH;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.7);

          const payload = {
            name: myName,
            data: dataUrl,
            type: 'image',
            time: new Date().toLocaleTimeString('ja-JP', {hour: '2-digit', minute:'2-digit'})
          };

          if (mode === 'channel') {
            db.ref('secret_channel').push(payload);
          } else if (mode === 'dm' && currentActiveDmUser) {
            const roomId = getDmRoomId(myName, currentActiveDmUser);
            db.ref('secret_dms/' + roomId).push(payload);
          }
        }
        img.src = e.target.result;
      }
      reader.readAsDataURL(file);
      inputElement.value = '';
    }

    // --- PeerJS 通話機能 ---
    let peer = null;
    let localStream = null;
    let currentCall = null;

    function initPeerJS() {
      peer = new Peer(myName);
      peer.on('call', async (call) => {
        if (confirm(`${call.peer} から通話の着信です。応答しますか？`)) {
          try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = localStream;
            call.answer(localStream);
            currentCall = call;
            call.on('stream', (stream) => {
              document.getElementById('remoteVideo').srcObject = stream;
            });
          } catch (e) {
            alert("カメラ・マイクの取得に失敗しました。");
          }
        } else {
          call.close();
        }
      });
    }

    async function startCall(withVideo) {
      const targetId = document.getElementById('targetIdInput').value.trim();
      if (!targetId) {
        alert("相手のエージェント名を入力してください！");
        return;
      }
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: withVideo, audio: true });
        document.getElementById('localVideo').srcObject = localStream;

        const call = peer.call(targetId, localStream);
        currentCall = call;
        call.on('stream', (stream) => {
          document.getElementById('remoteVideo').srcObject = stream;
        });
        alert("呼び出し中...");
      } catch (e) {
        alert("マイク・カメラの利用が許可されていません。");
      }
    }

    function hangUp() {
      if (currentCall) { currentCall.close(); currentCall = null; }
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      document.getElementById('localVideo').srcObject = null;
      document.getElementById('remoteVideo').srcObject = null;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
